[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.stripe.com; connect-src 'self' https://atwaixmsvzehheotdymf.supabase.co wss://atwaixmsvzehheotdymf.supabase.co https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; worker-src 'self'; manifest-src 'self'; media-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

# Sign-in metadata for AI tools that connect by signing in (ChatGPT). Points them to Supabase
# Auth's OAuth server; the founder approves on /oauth/consent/. Plug keys (Claude) are unchanged.
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache"

[[redirects]]
  from = "/.well-known/oauth-protected-resource/*"
  to = "/.well-known/oauth-protected-resource"
  status = 200
  force = true

# Supabase sends the founder to /oauth/consent (no slash); serve the page there directly so the
# authorization_id in the address is never lost to a slash redirect.
[[redirects]]
  from = "/oauth/consent"
  to = "/oauth/consent/index.html"
  status = 200
  force = true

# Short, typeable address for the HURKL plug (Mason's memory). Forwards to the Supabase function.
[[redirects]]
  from = "/mcp"
  to = "https://atwaixmsvzehheotdymf.supabase.co/functions/v1/mason-mcp"
  status = 200
  force = true
