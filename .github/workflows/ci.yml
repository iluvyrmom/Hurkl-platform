name: CI

on:
  pull_request:
  push:
    branches:
      - main

# No real credentials here, ever. NEXT_PUBLIC_APP_ENV=test and the two
# NEXT_PUBLIC_SUPABASE_* values below are fixed, non-secret placeholders that
# only satisfy lib/env.ts's format validation (a well-formed *.supabase.co
# URL, a non-empty key string) — see docs/development.md. CI never actually
# connects to Supabase, Trigger.dev, or any other external provider, and
# never uses A-1 Best Moving's credentials.
env:
  NEXT_PUBLIC_APP_ENV: test
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-real-key

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Environment validation (npm run env:check)
        run: npm run env:check

      - name: Formatting check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dependency security audit (report only — never auto-fixes)
        run: npm run audit:report
